name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nath-Ramirez
          outputs: |
            dist/github-contribution-snake.svg?color_snake=%238CE3FF&color_dots=%231B1230,%2335225C,%235B3A8C,%238A5CCF,%23C7A6FF
            dist/github-contribution-snake-dark.svg?palette=github-dark&color_snake=%238CE3FF&color_dots=%231B1230,%2335225C,%235B3A8C,%238A5CCF,%23C7A6FF

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
