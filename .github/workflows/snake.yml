name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nath-Ramirez
          outputs: |
            dist/github-contribution-snake.svg?color_snake=%238CE3FF&color_dots=%231B1230,%2335225C,%235B3A8C,%238A5CCF,%23C7A6FF
            dist/github-contribution-snake-dark.svg?palette=github-dark&color_snake=%238CE3FF&color_dots=%231B1230,%2335225C,%235B3A8C,%238A5CCF,%23C7A6FF

      - name: Fix dist permissions
        run: |
          sudo chown -R $USER:$USER dist
    
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate Contribution Languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/contribution_languages.py

      - name: Check generated files
        run: |
          ls -la dist

      - name: Push Profile Assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
