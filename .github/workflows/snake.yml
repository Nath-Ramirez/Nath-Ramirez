name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Nath-Ramirez
          outputs: |
            dist/github-contribution-snake.svg?color_snake=%238CE3FF
            dist/github-contribution-snake-dark.svg?palette=github-dark&color_snake=%238CE3FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
